name: Test

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall app.py codeup tests
      - name: Run tests
        run: python -m pytest -q

  # Targeted browser accessibility suite (tests/test_accessibility_axe.py):
  # renders /ide and the classroom pages in real headless Chromium and runs
  # axe-core against them. Kept as its own job (not folded into the `python`
  # job above) so the normal quick suite never needs a browser installed and
  # stays fast; only this job pays the one-time Chromium download cost.
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements-dev.txt') }}
      - name: Install Playwright Chromium only
        run: python -m playwright install --with-deps chromium
      - name: Run accessibility regression suite
        run: python -m pytest -q --run-full tests/test_accessibility_axe.py

  landing-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Build landing page
        run: npm run build
